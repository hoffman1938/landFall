# Deploy to Cloudflare on every green push to main.
#
# WHY A WORKER AND NOT PAGES
#
# LANDFALL cannot run on Cloudflare Pages. `iGaming/packages/edge/src/game.ts`
# exports `class LandfallGame extends DurableObject` — a SQLite-backed Durable
# Object that owns the round loop, the live pools and the WebSocket hub. Pages
# Functions cannot DEFINE or EXPORT a Durable Object class; they can only bind
# to one that already lives in a separately deployed Worker. Migrating to Pages
# would therefore mean running two deployments (Pages for the static bundle, a
# Worker for the game) and paying a cross-origin hop on every socket, to end up
# with strictly less than what one Worker already does.
#
# The Worker here IS the modern successor to Pages: `wrangler.jsonc` serves the
# built client through Workers Static Assets (`assets` + `run_worker_first`),
# which is the deployment model Cloudflare now points new projects at. Same
# platform, same static hosting, one deployment, and Durable Objects work.
#
# SETUP (once): add a repository secret `CLOUDFLARE_API_TOKEN` with the
# "Edit Cloudflare Workers" template, and `CLOUDFLARE_ACCOUNT_ID`.
# Settings → Secrets and variables → Actions → New repository secret.
name: Deploy

on:
  push:
    branches: [main]
  # Manual re-deploy, for rolling forward without an empty commit.
  workflow_dispatch:

# Never let two deploys race the same Worker; the later push wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build · deploy worker
    runs-on: ubuntu-latest
    # The Worker is the whole game, so it ships only from a green tree.
    # `ci.yml` runs on the same push; this waits for nothing and instead
    # re-runs the gates itself, because a deploy that trusts a parallel job to
    # have finished is a deploy that can ship a red build.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: iGaming/pnpm-lock.yaml

      - name: Install workspace
        working-directory: iGaming
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: iGaming
        run: pnpm typecheck

      - name: Test
        working-directory: iGaming
        run: pnpm test

      # Builds the client into iGaming/packages/web/dist, which wrangler.jsonc
      # points `assets.directory` at. The Worker itself is bundled by wrangler
      # from packages/edge/src/worker.ts and needs the workspace links above.
      - name: Build client
        working-directory: iGaming
        run: pnpm --filter @landfall/web build

      # Proves the Worker bundles and the bindings resolve before we touch
      # production. Catches a missing workspace link (which is exactly how this
      # deploy failed the first time) without shipping a broken version.
      - name: Verify Worker bundles
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
